name: Test synthetic retrieval pipeline
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime and project
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest
      - name: Run synthetic experiment
        run: python -m pattern_aware --config configs/demo.json --output artifacts/ci
